<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推流">
<title>推流</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=2">
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<main id="stage" class="stage" aria-live="polite"></main>
<p id="hint" class="hint" hidden>上滑看下一张 · 下滑看话题和收藏 · 左滑和助手聊天 · 双击收藏</p>

<div id="toast" class="toast" role="status"></div>

<section id="topics" class="sheet" aria-hidden="true">
  <div class="sheet-body" id="sheetBody">
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" data-panel="topicsPanel">话题</button>
      <button class="tab" role="tab" data-panel="favPanel">收藏</button>
    </div>
    <div id="topicsPanel" class="panel">
      <form id="addTopic" class="add">
        <textarea id="topicDesc" rows="2" placeholder="想跟进的新闻关键词，比如：Perth house prices（多个用逗号隔开）"></textarea>
        <button type="submit" class="primary">添加</button>
      </form>
      <div id="themeList"></div>
      <p id="statusLine" class="status-line"></p>
    </div>
    <div id="favPanel" class="panel" hidden>
      <div id="favList"></div>
    </div>
  </div>
  <button id="closeTopics" class="sheet-foot" aria-label="回到卡片">
    <span class="handle"></span>上滑回到卡片
  </button>
</section>

<section id="chat" class="chat" aria-hidden="true">
  <header class="chat-head">
    <button id="closeChat" class="back" aria-label="回到卡片">‹ 卡片</button>
    <b>推流助手</b>
    <span class="spacer"></span>
  </header>
  <div id="chatLog" class="chat-log"></div>
  <div id="chatCard" class="chat-card" hidden><span></span><button type="button" aria-label="不带这张卡片">✕</button></div>
  <form id="chatForm" class="chat-form">
    <textarea id="chatInput" rows="1" placeholder="想看什么新闻、做什么专题？"></textarea>
    <button type="submit" class="primary">发送</button>
  </form>
</section>

<script src="/static/app.js?v=8"></script>
</body>
</html>
