<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推流">
<title>推流</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=2">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="stage" class="stage" aria-live="polite"></main>
<p id="hint" class="hint" hidden>上滑看下一张 · 下滑看话题和收藏 · 双击收藏</p>

<div id="toast" class="toast" role="status"></div>

<section id="topics" class="sheet" aria-hidden="true">
  <div class="sheet-body" id="sheetBody">
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" data-panel="topicsPanel">话题</button>
      <button class="tab" role="tab" data-panel="favPanel">收藏</button>
    </div>
    <div id="topicsPanel" class="panel">
      <form id="addTopic" class="add">
        <textarea id="topicDesc" rows="2" placeholder="用一句话描述你想看的内容，比如：能在家里服务器上自己部署的开源软件"></textarea>
        <button type="submit" class="primary">添加</button>
      </form>
      <div id="themeList"></div>
      <p id="statusLine" class="status-line"></p>
    </div>
    <div id="favPanel" class="panel" hidden>
      <div id="favList"></div>
    </div>
  </div>
  <button id="closeTopics" class="sheet-foot" aria-label="回到卡片">
    <span class="handle"></span>上滑回到卡片
  </button>
</section>

<script src="/static/app.js"></script>
</body>
</html>
