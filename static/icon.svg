<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a52"/>
      <stop offset=".55" stop-color="#f06424"/>
      <stop offset="1" stop-color="#c93d0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- the card just swiped away, leaving upwards -->
  <rect x="148" y="52" width="216" height="64" rx="22" fill="url(#fadeUp)"/>
  <!-- soft shadow under the current card -->
  <rect x="100" y="152" width="312" height="236" rx="40" fill="#7a2200" fill-opacity=".10"/>
  <rect x="98" y="146" width="316" height="236" rx="38" fill="#7a2200" fill-opacity=".10"/>
  <!-- the current card -->
  <rect x="96" y="136" width="320" height="236" rx="36" fill="#fff"/>
  <rect x="132" y="172" width="84" height="22" rx="11" fill="#ffe1cf"/>
  <rect x="132" y="212" width="220" height="22" rx="11" fill="#2b1b13"/>
  <rect x="132" y="254" width="248" height="14" rx="7" fill="#d8c9c0"/>
  <rect x="132" y="280" width="204" height="14" rx="7" fill="#d8c9c0"/>
  <rect x="132" y="316" width="8" height="30" rx="4" fill="#f06424"/>
  <rect x="152" y="324" width="168" height="14" rx="7" fill="#f6b28a"/>
  <!-- the next card, coming up from below -->
  <rect x="120" y="396" width="272" height="64" rx="24" fill="url(#fadeDown)"/>
</svg>
